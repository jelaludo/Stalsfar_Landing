<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060e14"><title>HECTIC FLEET 07 · Six Down</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Six Down"><link rel="stylesheet" href="./style.css?v=hectic07"></head><body>
<canvas tabindex="0" aria-label="HUGIN landing field. Hold Space, W or up arrow to thrust; release to cut. Esc pauses; A and D or arrows rotate. Select a landing site with 1 to 7. L deploys legs."></canvas>
<script type="module">
import './pwa.js';
import {runLandingIntro} from './lander.js?v=hectic07';
const canvas=document.querySelector('canvas');
let recoveryAbort;

async function begin(){
 recoveryAbort?.abort();
 document.querySelector('.summary')?.remove();
 const params=new URLSearchParams(location.search);
 document.title=params.get('mode')==='classic'?'CLASSIC · Six Down':'HECTIC FLEET 07 · Six Down';
 const result=await runLandingIntro(canvas,{seed:params.get('seed')||(params.get('mode')!=='classic'?crypto.getRandomValues(new Uint32Array(1))[0]:20260907),mode:params.get('mode')||'fleet',entries:6});
 const panel=document.createElement('main');panel.className='summary';
 const celebration=result.status==='completed'&&result.survivors>=3;
 panel.classList.toggle('has-recovery',celebration);
 // Only controlled labels and numeric simulation values enter markup.
 panel.innerHTML=`${celebration?'<div class="recovery-stage" aria-label="Animated HUGIN cargo recovery, fixed isometric view"><span class="recovery-status eyebrow">ASSEMBLING HUGIN VIEW…</span></div>':''}<section class="report"><span class="eyebrow">STÅLSFÄR / RECOVERY REPORT</span><span class="grade">${result.grade}</span><h1>${result.status==='skipped'?'Arrival bypassed.':result.reconstructionUnlocked?'A beginning, secured.':celebration?'A foothold, secured.':'The ground remembers.'}</h1><p>${result.status==='skipped'?'Your default starting resources are ready.':`${result.survivors} of 6 boosters recovered. ${result.reconstructionUnlocked?'Launcher reconstruction unlocked.':'Recover at least 5 to unlock launcher reconstruction.'}`}</p><div class="resources">${Object.entries(result.resources).map(([k,v])=>`<div>${k.toUpperCase()}<b>${v}</b></div>`).join('')}</div><table><thead><tr><th>ENTRY</th><th>SITE</th><th>OUTCOME</th><th>CONTACT REPORT</th></tr></thead><tbody>${result.landings.map(r=>`<tr><td>H-${String(r.index+1).padStart(2,'0')}</td><td>${r.padId==null?'UNASSIGNED':`SEC ${String(r.padId+1).padStart(2,'0')}`}</td><td class="outcome-${r.outcome}">${r.outcome.toUpperCase()}</td><td>${r.verdict}</td></tr>`).join('')}</tbody></table><p>Assists used: ${result.assistsUsed.join(', ')||'none'}.</p><button class="primary" id="again">FLY AGAIN <span>↗</span></button><details><summary>HOST GAME HANDOFF / JSON</summary><pre></pre></details><p class="muted">Model by <a href="https://jelaludo.github.io/SentryTowers_A6/">jelaludo</a> · Six-booster 2D proof of concept</p></section>`;
 panel.querySelector('pre').textContent=JSON.stringify(result,null,2);document.body.append(panel);panel.querySelector('#again').addEventListener('click',begin,{once:true});panel.querySelector('#again').focus();
 if(celebration){
  const controller=new AbortController();recoveryAbort=controller;
  import('./recovery.js').then(({mountRecovery})=>{if(!controller.signal.aborted)return mountRecovery(panel.querySelector('.recovery-stage'),controller.signal);}).catch(()=>{panel.querySelector('.recovery-status').textContent='HUGIN / RECOVERY SECURED';});
 }
}
begin();
</script></body></html>
